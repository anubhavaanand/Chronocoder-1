name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-lint-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ruff only needs itself; installing the full runtime stack here just
      # to lint would add minutes and a dependency surface that can fail
      # for reasons unrelated to lint. The backend-tests job installs
      # requirements.txt with a pip cache.
      - name: Install dependencies
        run: pip install ruff

      # Rule set is pinned in ruff.toml so newer ruff releases can't
      # silently change what CI enforces.
      - name: Run ruff
        run: ruff check backend/

      # src/data/mentors.ts is generated from backend/mentors/*.json. Fail if
      # the committed file has drifted from the registry (#132).
      - name: Check generated mentor data is up to date
        run: python3 scripts/generate_mentor_data.py --check

  backend-tests:
    name: Backend Tests (WebSocket contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Pinned by pytest.ini (testpaths=backend/tests, pythonpath=.)
      - name: Run pytest
        run: python -m pytest backend/tests -v

  docker-validation:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: chronocoder-frontend:test

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: chronocoder-backend:test
