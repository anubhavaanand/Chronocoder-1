[server]
# Enable access from any device including mobile
headless = true
enableCORS = false
enableXsrfProtection = false

# Network configuration for mobile access
port = 8501
address = "0.0.0.0"

# Browser configuration
runOnSave = true
allowRunOnSave = true

[browser]
# Don't try to open browser automatically
gatherUsageStats = false

[theme]
# The Archive - warm near-black canvas, vellum ink, brass accent
primaryColor = "#c9a227"
backgroundColor = "#151310"
secondaryBackgroundColor = "#1d1a16"
textColor = "#eae3d2"
font = "sans serif"

[client]
# Client configuration
showErrorDetails = true
toolbarMode = "auto"
