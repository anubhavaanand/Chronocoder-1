# Ruff configuration for the ChronoCoder backend.
#
# CI installs the latest ruff (`pip install ruff`), whose default rule set
# grows stricter over time — unpinned defaults broke the backend-lint job
# with dozens of style-only findings (UP/DTZ/BLE/I-rules). This freezes the
# selection to ruff's stable flake8-equivalent baseline so future ruff
# releases can't silently turn CI red. Raise it deliberately, not implicitly.

line-length = 100
target-version = "py312"

[lint]
select = ["E4", "E7", "E9", "F"]
