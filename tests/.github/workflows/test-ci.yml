name: ChronoCoder Test Suite CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm run test:unit -- --coverage
      
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage.json
          flags: unit-tests
      
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-unit
          path: ./reports/test-results.xml
          retention-days: 30
  
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run integration tests
        run: npm run test:integration -- --retry=1
      
      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-integration
          path: ./reports/test-results.xml
          retention-days: 30
  
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Start application server
        run: npm run dev &
      
      - name: Run E2E tests
        run: npm run test:e2e -- --workers=2
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
  
  performance-tests:
    name: Performance & Lighthouse
    runs-on: ubuntu-latest
    needs: e2e-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Serve application
        run: |
          npx serve dist -l 3000 &
          sleep 5
      
      - name: Run Lighthouse audits
        run: |
          npx lighthouse http://localhost:3000 \
            --output=html \
            --output-path=./lighthouse-report.html \
            --preset=performance
      
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report.html
          retention-days: 90
  
  coverage-check:
    name: Coverage Threshold Check
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run full test suite with coverage
        run: npm run test:coverage
      
      - name: Publish coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/coverage.json
          flags: full-suite
          name: chronocoder-coverage
  
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, performance-tests, coverage-check]
    
    if: always()
    
    outputs:
      all_passed: ${{ steps.check-status.outputs.result }}
    
    steps:
      - name: Check job statuses
        id: check-status
        run: |
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.e2e-tests.result }}" != "success" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.performance-tests.result }}" != "success" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.coverage-check.result }}" != "success" ]; then
            echo "result=failure" >> $GITHUB_OUTPUT
          else
            echo "result=success" >> $GITHUB_OUTPUT
          fi
  
  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs: quality-gate
    
    if: always()
    
    steps:
      - name: Report status
        run: |
          if [ "${{ needs.quality-gate.outputs.all_passed }}" == "true" ]; then
            echo "✅ All tests passed successfully!"
          else
            echo "❌ Some tests failed. Please review the failures."
            exit 1
          fi
